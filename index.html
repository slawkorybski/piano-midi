<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Wizualizacja MIDI - Perfekcyjna Odległość</title>
    <script src="vexflow-min.js"></script>
    <style>
        body { font-family: sans-serif; background: #f4f7f6; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        .controls { margin-bottom: 10px; display: flex; gap: 10px; align-items: center; }
        select { padding: 8px; font-size: 15px; border-radius: 5px; }
        #output { background: white; padding: 10px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .legend { margin: 15px 0 0 0; background: #e8ecef; padding: 10px; font-size: 13px; border-radius: 5px; text-align: left; }
        #midi-status-bar { margin-top: 15px; width: 100%; max-width: 520px; padding: 12px; border-radius: 8px; font-weight: bold; text-align: center; box-sizing: border-box; border: 2px solid #2980b9; background: #ebf5fb; color: #2980b9; cursor: pointer; transition: all 0.2s ease; }
        #midi-status-bar:hover { background: #d4e6f1; }
        .midi-connected { background: #d4edda !important; color: #155724 !important; border-color: #28a745 !important; cursor: default !important; }
        .midi-disconnected { background: #ffdde1 !important; color: #c0392b !important; border-color: #e74c3c !important; cursor: pointer !important; }
    </style>
</head>
<body>
    <h3>Wizualizacja MIDI</h3>
    <div class="controls">
        <label for="key-select"><strong>Tonacja:</strong></label>
        <select id="key-select">
            <option value="C">C-dur / a-moll</option>
            <option value="G">G-dur (1♯)</option><option value="D">D-dur (2♯)</option><option value="A">A-dur (3♯)</option>
            <option value="E">E-dur (4♯)</option><option value="B">B-dur (5♯)</option><option value="F#">F#-dur (6♯)</option>
            <option value="F">F-dur (1♭)</option><option value="Bb">B-dur (2♭)</option><option value="Eb">Es-dur (3♭)</option>
            <option value="Ab">As-dur (4♭)</option><option value="Db">Des-dur (5♭)</option><option value="Gb">Ges-dur (6♭)</option>
        </select>
    </div>
    
    <div id="output"></div>
    <div id="midi-status-bar" onclick="initMIDI()">🎹 Kliknij tutaj, aby połączyć i uruchomić MIDI</div>
    <div class="legend"><strong>Klawiatura testowa:</strong> Klucz basowy: Z do M | Klucz wiolinowy: A do K<br>Białe: A=C4, S=D4... | Czarne: W=C#4, E=D#4...</div>

    <script>
        const { Renderer, Stave, StaveNote, Voice, Formatter, Accidental } = Vex.Flow;
        let activeNotes = new Set(), noteMap = {}, currentKey = "C", gAccess = null;
        const keyMap = { 'z':48,'x':50,'c':52,'v':53,'b':55,'n':57,'m':59,'a':60,'w':61,'s':62,'e':63,'d':64,'f':65,'t':66,'g':67,'y':68,'h':69,'u':70,'j':71,'k':72 };
        
        function setNotes(key) {
            noteMap = {}; const flats = ["F","Bb","Eb","Ab","Db","Gb"];
            let names = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
            if (flats.includes(key)) names = ["C", "Db", "D", "Eb", "E", "F", "Gb", "G", "Ab", "A", "Bb", "B"];
            for (let i = 21; i <= 108; i++) {
                let name = names[i % 12], oct = Math.floor(i / 12) - 1;
                noteMap[i] = { key: `${name}/${oct}`, sharp: name.includes("#"), flat: name.includes("b") };
            }
        }
        setNotes("C");

        const div = document.getElementById("output");
        // Wysokość zmniejszona do 210px, aby zlikwidować pustą przestrzeń na dole okna
        const renderer = new Renderer(div, Renderer.Backends.SVG).resize(520, 210);
        const ctx = renderer.getContext();

        function draw() {
            ctx.clear();
            
            // OSTATECZNA POPRAWKA: Klucz wiolinowy na Y=10, basowy podciągnięty aż na Y=70.
            // Przestrzeń została zaciśnięta do podręcznikowego maksimum.
            const tStave = new Stave(10, 10, 480).addClef("treble").addKeySignature(currentKey).setContext(ctx).draw();
            const bStave = new Stave(10, 70, 480).addClef("bass").addKeySignature(currentKey).setContext(ctx).draw();
            
            let tN = [], bN = [];
            
            Array.from(activeNotes).sort((a,b)=>a-b).forEach(id => {
                if (noteMap[id]) { 
                    if (id >= 60) tN.push(noteMap[id]); else bN.push(noteMap[id]);
                }
            });

            const formatter = new Formatter();
            let tVoice = null, bVoice = null;

            if (tN.length > 0) {
                const sn = new StaveNote({ clef: "treble", keys: tN.map(n => n.key), duration: "w" });
                tN.forEach((n, i) => { 
                    if(n.sharp) sn.addModifier(i, new Accidental("#")); 
                    if(n.flat) sn.addModifier(i, new Accidental("b")); 
                });
                tVoice = new Voice({ num_beats:4, beat_value:4 }).setMode(Voice.Mode.SOFT).addTickables([sn]);
                formatter.joinVoices([tVoice]);
            }
            
            if (bN.length > 0) {
                const sn = new StaveNote({ clef: "bass", keys: bN.map(n => n.key), duration: "w" });
                bN.forEach((n, i) => { 
                    if(n.sharp) sn.addModifier(i, new Accidental("#")); 
                    if(n.flat) sn.addModifier(i, new Accidental("b")); 
                });
                bVoice = new Voice({ num_beats:4, beat_value:4 }).setMode(Voice.Mode.SOFT).addTickables([sn]);
                formatter.joinVoices([bVoice]);
            }

            let voicesToFormat = [];
            if (tVoice) voicesToFormat.push(tVoice);
            if (bVoice) voicesToFormat.push(bVoice);

            if (voicesToFormat.length > 0) {
                formatter.format(voicesToFormat, 320);
                if (tVoice) tVoice.draw(ctx, tStave);
                if (bVoice) bVoice.draw(ctx, bStave);
            }
        }
        draw();

        document.getElementById("key-select").addEventListener("change", (e) => {
            currentKey = e.target.value; setNotes(currentKey); draw(); e.target.blur();
        });
        window.addEventListener('keydown', (e) => { let k=e.key.toLowerCase(); if(keyMap[k]&&!activeNotes.has(keyMap[k])){ activeNotes.add(keyMap[k]); draw(); } });
        window.addEventListener('keyup', (e) => { let k=e.key.toLowerCase(); if(keyMap[k]){ activeNotes.delete(keyMap[k]); draw(); } });

        function updateBar(access) {
            const bar = document.getElementById("midi-status-bar");
            const inputs = Array.from(access.inputs.values());
            if (inputs.length > 0) {
                let devName = inputs.name || "Urządzenie MIDI";
                bar.innerText = `🟢 Połączono z: ${devName}`; bar.className = "midi-connected";
                bar.onclick = null;
                inputs.forEach(input => input.onmidimessage = (msg) => {
                    let cmd = msg.data, note = msg.data, vel = msg.data;
                    if (cmd >= 144 && cmd <= 159 && vel > 0) { activeNotes.add(note); draw(); }
                    else if ((cmd >= 128 && cmd <= 143) || (cmd >= 144 && cmd <= 159 && vel === 0)) { activeNotes.delete(note); draw(); }
                });
            } else { 
                bar.innerText = "🔴 Brak urządzeń. Włącz pianino i kliknij tutaj ponownie."; 
                bar.className = "midi-disconnected"; 
                bar.onclick = initMIDI;
            }
        }

        function initMIDI() {
            const bar = document.getElementById("midi-status-bar");
            bar.innerText = "⏳ Łączenie z systemem MIDI...";
            if (navigator.requestMIDIAccess) {
                navigator.requestMIDIAccess().then(access => {
                    gAccess = access; updateBar(access);
                    access.onstatechange = () => updateBar(gAccess);
                }).catch((err) => { 
                    bar.className = "midi-disconnected"; 
                    bar.innerText = "🔴 Odrzucono uprawnienia lub błąd: " + err.message; 
                });
            } else { 
                bar.className = "midi-disconnected";
                bar.innerText = "🔴 Ta przeglądarka nie obsługuje systemów Web MIDI API."; 
            }
        }
    </script>
</body>
</html>
