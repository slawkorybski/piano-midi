<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Wizualizacja MIDI</title>
    <script src="vexflow-min.js"></script>
    <style>
        body { font-family: sans-serif; background: #f4f7f6; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; min-height: 94vh; }
        .controls { margin-bottom: 10px; display: flex; gap: 10px; align-items: center; }
        select { padding: 8px; font-size: 15px; border-radius: 5px; }
        #output { background: white; padding: 10px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .legend { margin: 10px 0; background: #e8ecef; padding: 10px; font-size: 13px; border-radius: 5px; text-align: left; }
        #midi-status-bar { margin-top: auto; width: 100%; max-width: 500px; padding: 10px; border-radius: 8px; font-weight: bold; text-align: center; box-sizing: border-box; border: 2px solid #ccc; }
        .midi-prompt { background: #ffeaa7; color: #d35400; border-color: #f39c12 !important; cursor: pointer; }
        .midi-connected { background: #d4edda; color: #155724; border-color: #28a745; }
        .midi-disconnected { background: #ffdde1; color: #c0392b; border-color: #e74c3c; }
    </style>
</head>
<body>
    <h3>Wizualizacja MIDI</h3>
    <div class="controls">
        <label for="key-select"><strong>Tonacja:</strong></label>
        <select id="key-select">
            <option value="C">C-dur / a-moll</option>
            <option value="G">G-dur (1♯)</option><option value="D">D-dur (2♯)</option><option value="A">A-dur (3♯)</option>
            <option value="E">E-dur (4♯)</option><option value="B">B-dur (5♯)</option><option value="F#">F#-dur (6♯)</option>
            <option value="F">F-dur (1♭)</option><option value="Bb">B-dur (2♭)</option><option value="Eb">Es-dur (3♭)</option>
            <option value="Ab">As-dur (4♭)</option><option value="Db">Des-dur (5♭)</option><option value="Gb">Ges-dur (6♭)</option>
        </select>
    </div>
    <div id="output"></div>
    <div class="legend"><strong>Klawiatura:</strong> Białe: A do J | Czarne: W, E, T, Y, U</div>
    <div id="midi-status-bar">Inicjalizacja systemu MIDI...</div>

    <script>
        const { Renderer, Stave, StaveNote, Voice, Formatter, Accidental } = Vex.Flow;
        let activeNotes = new Set(), noteMap = {}, currentKey = "C", gAccess = null;
        const keyMap = { 'z':48,'x':50,'c':52,'v':53,'b':55,'n':57,'m':59,'a':60,'w':61,'s':62,'e':63,'d':64,'f':65,'t':66,'g':67,'y':68,'h':69,'u':70,'j':71,'k':72 };
        const isMobile = /Android|iPhone|iPad/i.test(navigator.userAgent);
        
        function setNotes(key) {
            noteMap = {}; const flats = ["F","Bb","Eb","Ab","Db","Gb"];
            let names = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
            if (flats.includes(key)) names = ["C", "Db", "D", "Eb", "E", "F", "Gb", "G", "Ab", "A", "Bb", "B"];
            for (let i = 21; i <= 108; i++) {
                let name = names[i % 12], oct = Math.floor(i / 12) - 1;
                noteMap[i] = { key: `${name}/${oct}`, sharp: name.includes("#"), flat: name.includes("b") };
            }
        }
        setNotes("C");

        const div = document.getElementById("output");
        const renderer = new Renderer(div, Renderer.Backends.SVG).resize(520, 420);
        const ctx = renderer.getContext();

        function draw() {
            ctx.clear();
            const tStave = new Stave(10, 60, 480).addClef("treble").addKeySignature(currentKey).setContext(ctx).draw();
            const bStave = new Stave(10, 220, 480).addClef("bass").addKeySignature(currentKey).setContext(ctx).draw();
            let tN = [], bN = [];
            Array.from(activeNotes).sort((a,b)=>a-b).forEach(id => {
                if (noteMap[id]) { if (id >= 60) tN.push(noteMap[id]); else bN.push(noteMap[id]); }
            });
            if (tN.length > 0) {
                const sn = new StaveNote({ clef: "treble", keys: tN.map(n => n.key), duration: "w" });
                tN.forEach((n, i) => { if(n.sharp) sn.addModifier(i, new Accidental("#")); if(n.flat) sn.addModifier(i, new Accidental("b")); });
                const v = new Voice({ num_beats:4, beat_value:4 }).setMode(Voice.Mode.SOFT).addTickables([sn]);
                new Formatter().joinVoices([v]).format([v], 320); v.draw(ctx, tStave);
            }
            if (bN.length > 0) {
                const sn = new StaveNote({ clef: "bass", keys: bN.map(n => n.key), duration: "w" });
                bN.forEach((n, i) => { if(n.sharp) sn.addModifier(i, new Accidental("#")); if(n.flat) sn.addModifier(i, new Accidental("b")); });
                const v = new Voice({ num_beats:4, beat_value:4 }).setMode(Voice.Mode.SOFT).addTickables([sn]);
                new Formatter().joinVoices([v]).format([v], 320); v.draw(ctx, bStave);
            }
        }
        draw();

        document.getElementById("key-select").addEventListener("change", (e) => {
            currentKey = e.target.value; setNotes(currentKey); draw(); e.target.blur();
        });
        window.addEventListener('keydown', (e) => { let k=e.key.toLowerCase(); if(keyMap[k]&&!activeNotes.has(keyMap[k])){ activeNotes.add(keyMap[k]); draw(); } });
        window.addEventListener('keyup', (e) => { let k=e.key.toLowerCase(); if(keyMap[k]){ activeNotes.delete(keyMap[k]); draw(); } });

        function updateBar(access) {
            const bar = document.getElementById("midi-status-bar");
            const inputs = Array.from(access.inputs.values());
            bar.onclick = null;
            if (inputs.length > 0) {
                let devName = inputs[0].name || "Urządzenie MIDI";
                bar.innerText = `🟢 Połączono: ${devName}`; bar.className = "midi-connected";
                inputs.forEach(input => input.onmidimessage = (msg) => {
                    let cmd = msg.data[0], note = msg.data[1], vel = msg.data[2];
                    if (cmd >= 144 && cmd <= 159 && vel > 0) { activeNotes.add(note); draw(); }
                    else if ((cmd >= 128 && cmd <= 143) || (cmd >= 144 && cmd <= 159 && vel === 0)) { activeNotes.delete(note); draw(); }
                });
            } else { bar.innerText = "🔴 Oczekiwanie na urządzenie MIDI..."; bar.className = "midi-disconnected"; }
        }

        function initMIDI() {
            if (navigator.requestMIDIAccess) {
                navigator.requestMIDIAccess().then(access => {
                    gAccess = access; updateBar(access);
                    access.onstatechange = () => updateBar(gAccess);
                }).catch(() => { document.getElementById("midi-status-bar").className = "midi-disconnected"; document.getElementById("midi-status-bar").innerText = "🔴 Brak uprawnień do MIDI."; });
            } else { document.getElementById("midi-status-bar").innerText = "🔴 Przeglądarka nie obsługuje MIDI."; }
        }

        const bar = document.getElementById("midi-status-bar");
        if (isMobile) {
            bar.innerText = "⚠️ Mobilny Android/iOS: Kliknij tutaj, aby połączyć MIDI";
            bar.className = "midi-prompt";
            bar.onclick = initMIDI;
        } else {
            initMIDI(); // Automatyczny start dla Windowsa i systemów stacjonarnych
        }
    </script>
</body>
</html>
