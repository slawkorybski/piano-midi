<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Wizualizacja MIDI - Pełne 88 Klawiszy</title>
    <script src="vexflow-min.js"></script>
    <style>
        body { font-family: sans-serif; background: #f4f7f6; padding: 20px; text-align: center; }
        #start-btn { padding: 10px 20px; font-size: 16px; cursor: pointer; font-weight: bold; }
        #output { margin-top: 20px; background: white; padding: 20px; border-radius: 10px; display: inline-block; }
        .legend { margin-top: 20px; background: #e8ecef; padding: 15px; display: inline-block; text-align: left; line-height: 1.5; }
    </style>
</head>
<body>
    <h1>Wizualizacja MIDI - Pełne Rejestry & Półtony</h1>
    <button id="start-btn">Uruchom system MIDI</button>
    <br><div id="output"></div><br>
    <div class="legend">
        <strong>Symulator (sekcja środkowa):</strong><br>
        Białe: <code>A</code> <code>S</code> <code>D</code> <code>F</code> <code>G</code> <code>H</code> <code>J</code> | Czarne (♯): <code>W</code> <code>E</code> <code>T</code> <code>Y</code> <code>U</code>
    </div>
    <script>
        const { Renderer, Stave, StaveNote, Voice, Formatter, Accidental } = Vex.Flow;
        let activeNotes = new Set();
        
        const keyMap = { 'z':48,'x':50,'c':52,'v':53,'b':55,'n':57,'m':59,'a':60,'w':61,'s':62,'e':63,'d':64,'f':65,'t':66,'g':67,'y':68,'h':69,'u':70,'j':71,'k':72 };

        // BEZBŁĘDNA MAPA DLA WSZYSTKICH 88 KLAWISZY (MIDI 21 - 108) WRAZ Z PÓŁTONAMI
        const baseNames = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
        const noteMap = {};
        for (let i = 21; i <= 108; i++) {
            const noteIndex = i % 12;
            const octave = Math.floor(i / 12) - 1;
            const fullName = baseNames[noteIndex];
            const hasAccidental = fullName.includes("#");
            noteMap[i] = { key: `${fullName}/${octave}`, acc: hasAccidental };
        }

        // Zwiększony rozmiar pionowy (500px), aby skrajne górne i dolne nuty mieściły się w oknie
        const div = document.getElementById("output");
        const renderer = new Renderer(div, Renderer.Backends.SVG).resize(550, 500);
        const context = renderer.getContext();

        function draw() {
            context.clear();
            // Obniżona pozycja Y pięciolinii (klucz wiolinowy na 120px, basowy na 280px), dająca miejsce na wysokie dźwięki
            const tStave = new Stave(20, 120, 450).addClef("treble").setContext(context).draw();
            const bStave = new Stave(20, 280, 450).addClef("bass").setContext(context).draw();
            
            let tNotes = [], bNotes = [];
            
            Array.from(activeNotes).sort((a,b)=>a-b).forEach(id => {
                if (noteMap[id]) {
                    if (id >= 60) tNotes.push(noteMap[id]); else bNotes.push(noteMap[id]);
                }
            });

            // Rysowanie klucza wiolinowego
            if (tNotes.length > 0) {
                const sn = new StaveNote({ clef: "treble", keys: tNotes.map(n => n.key), duration: "w" });
                tNotes.forEach((n, idx) => {
                    if (n.acc) sn.addModifier(idx, new Accidental("#"));
                });
                const v = new Voice({ num_beats:4, beat_value:4 }).setMode(Voice.Mode.SOFT).addTickables([sn]);
                new Formatter().joinVoices([v]).format([v], 380); v.draw(context, tStave);
            }

            // Rysowanie klucza basowego
            if (bNotes.length > 0) {
                const sn = new StaveNote({ clef: "bass", keys: bNotes.map(n => n.key), duration: "w" });
                bNotes.forEach((n, idx) => {
                    if (n.acc) sn.addModifier(idx, new Accidental("#"));
                });
                const v = new Voice({ num_beats:4, beat_value:4 }).setMode(Voice.Mode.SOFT).addTickables([sn]);
                new Formatter().joinVoices([v]).format([v], 380); v.draw(context, bStave);
            }
        }
        draw();
        
        window.addEventListener('keydown', (e) => { const k=e.key.toLowerCase(); if(keyMap[k]&&!activeNotes.has(keyMap[k])){ activeNotes.add(keyMap[k]); draw(); } });
        window.addEventListener('keyup', (e) => { const k=e.key.toLowerCase(); if(keyMap[k]){ activeNotes.delete(keyMap[k]); draw(); } });
        
        document.getElementById("start-btn").addEventListener("click", () => {
            if (navigator.requestMIDIAccess) {
                navigator.requestMIDIAccess().then(access => {
                    for (let input of access.inputs.values()) {
                        input.onmidimessage = (msg) => {
                            const cmd=msg.data, note=msg.data, vel=msg.data;
                            if((cmd===144||cmd===153)&&vel>0){ activeNotes.add(note); draw(); }
                            else if(cmd===128||cmd===137||((cmd===144||cmd===153)&&vel===0)){ activeNotes.delete(note); draw(); }
                        };
                    }
                });
            }
        });
    </script>
</body>
</html>
