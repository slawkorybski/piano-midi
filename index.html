<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Wizualizacja MIDI - Pełne Znaki</title>
    <script src="vexflow-min.js"></script>
    <style>
        body { font-family: sans-serif; background: #f4f7f6; padding: 20px; text-align: center; }
        .controls { margin-bottom: 15px; display: flex; justify-content: center; gap: 15px; align-items: center; flex-wrap: wrap; }
        #start-btn { padding: 10px 20px; font-size: 16px; cursor: pointer; font-weight: bold; background-color: #3498db; color: white; border: none; border-radius: 5px; }
        #start-btn:hover { background-color: #2980b9; }
        select { padding: 10px; font-size: 16px; border-radius: 5px; border: 1px solid #ccc; background: white; cursor: pointer; }
        #output { margin-top: 20px; background: white; padding: 20px; border-radius: 10px; display: inline-block; }
        .legend { margin-top: 20px; background: #e8ecef; padding: 15px; display: inline-block; text-align: left; line-height: 1.5; }
    </style>
</head>
<body>
    <h1>Wizualizacja MIDI - Znaki przy Kluczu i przy Nutach</h1>
    
    <div class="controls">
        <button id="start-btn">Uruchom system MIDI</button>
        <label for="key-select"><strong>Tonacja utworu:</strong></label>
        <select id="key-select">
            <option value="C">C-dur / a-moll (Brak znaków)</option>
            <optgroup label="Tonacje Krzyżykowe (♯)">
                <option value="G">G-dur / e-moll (1 krzyżyk: F#)</option>
                <option value="D">D-dur / b-moll (2 krzyżyki: F#, C#)</option>
                <option value="A">A-dur / f#-moll (3 krzyżyki: F#, C#, G#)</option>
                <option value="E">E-dur / c#-moll (4 krzyżyki: F#, C#, G#, D#)</option>
                <option value="B">B-dur / g#-moll (5 krzyżyków: F#, C#, G#, D#, A#)</option>
                <option value="F#">F#-dur / d#-moll (6 krzyżyków: F#, C#, G#, D#, A#, E#)</option>
                <option value="C#">C#-dur / a#-moll (7 krzyżyków: F#, C#, G#, D#, A#, E#, B#)</option>
            </optgroup>
            <optgroup label="Tonacje Bemolowe (♭)">
                <option value="F">F-dur / d-moll (1 bemol: Bb)</option>
                <option value="Bb">B-dur / g-moll (2 bemole: Bb, Eb)</option>
                <option value="Eb">Es-dur / c-moll (3 bemole: Bb, Eb, Ab)</option>
                <option value="Ab">As-dur / f-moll (4 bemole: Bb, Eb, Ab, Db)</option>
                <option value="Db">Des-dur / b-moll (5 bemoli: Bb, Eb, Ab, Db, Gb)</option>
                <option value="Gb">Ges-dur / es-moll (6 bemoli: Bb, Eb, Ab, Db, Gb, Cb)</option>
                <option value="Cb">Ces-dur / as-moll (7 bemoli: Bb, Eb, Ab, Db, Gb, Cb, Fb)</option>
            </optgroup>
        </select>
    </div>

    <br><div id="output"></div><br>
    
    <div class="legend">
        <strong>Symulator (sekcja środkowa):</strong><br>
        Białe: <code>A</code> <code>S</code> <code>D</code> <code>F</code> <code>G</code> <code>H</code> <code>J</code> | Czarne: <code>W</code> <code>E</code> <code>T</code> <code>Y</code> <code>U</code>
    </div>

    <script>
        const { Renderer, Stave, StaveNote, Voice, Formatter, Accidental } = Vex.Flow;
        let activeNotes = new Set();
        let noteMap = {};
        let currentKey = "C";
        
        const keyMap = { 'z':48,'x':50,'c':52,'v':53,'b':55,'n':57,'m':59,'a':60,'w':61,'s':62,'e':63,'d':64,'f':65,'t':66,'g':67,'y':68,'h':69,'u':70,'j':71,'k':72 };

        const keyConfigurations = {
            'C':  ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"],
            'G':  ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"],
            'D':  ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"],
            'A':  ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"],
            'E':  ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"],
            'B':  ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"],
            'F#': ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"],
            'C#': ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"],
            'F':  ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "B|b", "B"],
            'Bb': ["C", "C#", "D", "E|b", "E", "F", "F#", "G", "G#", "A", "B|b", "B"],
            'Eb': ["C", "C#", "D", "E|b", "E", "F", "F#", "G", "A|b", "A", "B|b", "B"],
            'Ab': ["C", "D|b", "D", "E|b", "E", "F", "F#", "G", "A|b", "A", "B|b", "B"],
            'Db': ["C", "D|b", "D", "E|b", "E", "F", "G|b", "G", "A|b", "A", "B|b", "B"],
            'Gb': ["C", "D|b", "D", "E|b", "E", "F", "G|b", "G", "A|b", "A", "B|b", "C|b"],
            'Cb': ["D|b", "D|b", "D", "E|b", "F|b", "F", "G|b", "G", "A|b", "A", "B|b", "C|b"]
        };

        function generateNoteMap(keySignature) {
            noteMap = {};
            let baseNames = keyConfigurations[keySignature] || keyConfigurations['C'];
            
            for (let i = 21; i <= 108; i++) {
                const noteIndex = i % 12;
                let octave = Math.floor(i / 12) - 1;
                let fullName = baseNames[noteIndex];
                
                let hasSharp = fullName.includes("#");
                let hasFlat = fullName.includes("|b");
                if (hasFlat) fullName = fullName.replace("|b", "b");
                
                // POPRAWKA: Znaki przygodne są teraz zawsze widoczne dla każdego czarnego klawisza
                noteMap[i] = { 
                    key: `${fullName}/${octave}`, 
                    accSharp: hasSharp,
                    accFlat: hasFlat
                };
            }
        }

        generateNoteMap('C');

        const div = document.getElementById("output");
        const renderer = new Renderer(div, Renderer.Backends.SVG).resize(550, 500);
        const context = renderer.getContext();

        function draw() {
            context.clear();
            
            const tStave = new Stave(20, 120, 450).addClef("treble").addKeySignature(currentKey).setContext(context).draw();
            const bStave = new Stave(20, 280, 450).addClef("bass").addKeySignature(currentKey).setContext(context).draw();
            
            let tNotes = [], bNotes = [];
            
            Array.from(activeNotes).sort((a,b)=>a-b).forEach(id => {
                if (noteMap[id]) {
                    if (id >= 60) tNotes.push(noteMap[id]); else bNotes.push(noteMap[id]);
                }
            });

            if (tNotes.length > 0) {
                const sn = new StaveNote({ clef: "treble", keys: tNotes.map(n => n.key), duration: "w" });
                tNotes.forEach((n, idx) => {
                    if (n.accSharp) sn.addModifier(idx, new Accidental("#"));
                    if (n.accFlat) sn.addModifier(idx, new Accidental("b"));
                });
                const v = new Voice({ num_beats:4, beat_value:4 }).setMode(Voice.Mode.SOFT).addTickables([sn]);
                new Formatter().joinVoices([v]).format([v], 310); v.draw(context, tStave);
            }

            if (bNotes.length > 0) {
                const sn = new StaveNote({ clef: "bass", keys: bNotes.map(n => n.key), duration: "w" });
                bNotes.forEach((n, idx) => {
                    if (n.accSharp) sn.addModifier(idx, new Accidental("#"));
                    if (n.accFlat) sn.addModifier(idx, new Accidental("b"));
                });
                const v = new Voice({ num_beats:4, beat_value:4 }).setMode(Voice.Mode.SOFT).addTickables([sn]);
                new Formatter().joinVoices([v]).format([v], 310); v.draw(context, bStave);
            }
        }
        draw();

        document.getElementById("key-select").addEventListener("change", (e) => {
            currentKey = e.target.value;
            generateNoteMap(currentKey);
            draw();
            e.target.blur();
        });
        
        window.addEventListener('keydown', (e) => { const k=e.key.toLowerCase(); if(keyMap[k]&&!activeNotes.has(keyMap[k])){ activeNotes.add(keyMap[k]); draw(); } });
        window.addEventListener('keyup', (e) => { const k=e.key.toLowerCase(); if(keyMap[k]){ activeNotes.delete(keyMap[k]); draw(); } });
        
        document.getElementById("start-btn").addEventListener("click", () => {
            if (navigator.requestMIDIAccess) {
                navigator.requestMIDIAccess().then(access => {
                    alert("System MIDI uruchomiony pomyślnie!");
                    for (let input of access.inputs.values()) {
                        input.onmidimessage = (msg) => {
                            const cmd = msg.data;
                            const note = msg.data;
                            const vel = msg.data;
                            if ((cmd >= 144 && cmd <= 159) && vel > 0) { activeNotes.add(note); draw(); }
                            else if ((cmd >= 128 && cmd <= 143) || (cmd >= 144 && cmd <= 159 && vel === 0)) { activeNotes.delete(note); draw(); }
                        };
                    }
                });
            }
        });
    </script>
</body>
</html>
